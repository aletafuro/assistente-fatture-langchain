# Avvio del bot e dell'API nel container, con un solo comando:   docker compose up -d
# Log:   docker compose logs -f        Stop:   docker compose down
#
# - le impostazioni e i segreti arrivano dal file .env (non entra mai nell'immagine);
# - dati/ e segreti/ restano sul computer (o sul disco del server) e vengono "collegati" al container:
#   aggiornare l'immagine non cancella né il registro né le credenziali Google.
services:
  bot:
    build: .
    image: assistente-fatture:3.0
    env_file: .env
    environment:
      CARTELLA_DATI: /dati
      # Usato solo con RAG_INDICE=pgvector nel .env: dentro Docker il database si chiama "db".
      PGVECTOR_URL: postgresql+psycopg://fatture:${PGVECTOR_PASSWORD:-}@db:5432/fatture
    volumes:
      - ./dati:/dati
      - ./segreti:/app/segreti
    restart: unless-stopped

  # API REST di sola lettura: stessa immagine e stessi dati del bot, un altro comando.
  # La porta è aperta solo sul computer stesso (127.0.0.1): per esporla fuori serve un proxy
  # HTTPS davanti (es. Caddy o nginx), mai la porta nuda su internet.
  api:
    image: assistente-fatture:3.0
    depends_on: [bot]                   # l'immagine la costruisce il servizio bot
    env_file: .env
    environment:
      CARTELLA_DATI: /dati
    volumes:
      - ./dati:/dati:ro                 # :ro = sola lettura anche per il sistema operativo
    command: ["uvicorn", "api_fatture:app", "--app-dir", "app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salute')"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  # Postgres + pgvector per l'indice del RAG. Facoltativo: parte solo con
  #   docker compose --profile pgvector up -d      (e RAG_INDICE=pgvector, PGVECTOR_PASSWORD nel .env)
  # Nessuna porta verso l'esterno: lo raggiunge solo il bot, dalla rete interna di Docker.
  db:
    image: pgvector/pgvector:pg17
    profiles: [pgvector]
    environment:
      POSTGRES_USER: fatture
      POSTGRES_DB: fatture
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-}
    volumes:
      - ./dati/pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fatture"]
      interval: 10s
    restart: unless-stopped
