[project]
name = "assistente-fatture"
version = "3.0.0"
description = "Assistente AI per le fatture fornitori (italiane ed estere): LangGraph, Telegram, MLOps."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-community==0.4.2",
    "mcp==1.30.0",
    "aiosqlite==0.22.1",
    "openai==3.5.0",
    "pydantic==2.13.4",
    "pypdf==6.19.0",
    "python-dotenv==1.2.3",
    "python-telegram-bot[job-queue]==22.8",
    "httpx==0.28.1",
    "google-api-python-client==2.200.0",
    "google-auth==2.58.1",
    "google-auth-oauthlib==1.4.1",
    "openpyxl==3.1.5",
    "tzdata==2026.3",
]

# Strumenti che servono solo a chi sviluppa: non finiscono nel container di produzione.
[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
