# Test automatici della v3 a ogni modifica (come nel modulo MLOps, con uv e pytest).
# I test NON chiamano il modello e NON vanno in rete: sono gratuiti e danno sempre lo stesso risultato.
# Poi si costruisce il container: se l'immagine non si costruisce, la modifica non è pronta.
name: v3 - test e container

on:
  push:
    paths: ["v3/**", ".github/workflows/v3-test.yml"]
  pull_request:
    paths: ["v3/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    # Postgres con pgvector, solo per il test dell'indice del RAG (embedding finti: nessun costo).
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fatture
          POSTGRES_PASSWORD: solo-per-i-test
          POSTGRES_DB: fatture
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fatture" --health-interval 5s --health-retries 10
    env:
      PGVECTOR_TEST_URL: postgresql+psycopg://fatture:solo-per-i-test@127.0.0.1:5432/fatture
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Installa uv
        uses: astral-sh/setup-uv@v7

      - name: Test (versioni esatte del lock file)
        run: uv run --frozen pytest -q

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Test dentro il container
        run: docker build --target test -t assistente-fatture:test v3

      - name: Immagine di produzione
        run: docker build -t assistente-fatture:${{ github.sha }} v3
